[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "webmail-mcp"
version = "0.1.0"
description = "A local IMAP/SMTP MCP connector for university and self-hosted email."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Rasti Salam Mohammed"}]
keywords = ["mcp", "imap", "smtp", "webmail", "chatgpt", "claude", "university"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Communications :: Email",
  "Operating System :: OS Independent",
]
dependencies = ["mcp==1.30.0", "keyring==25.7.0"]

[project.scripts]
webmail-mcp = "webmail_mcp.server:main"

[tool.setuptools.packages.find]
include = ["webmail_mcp*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
